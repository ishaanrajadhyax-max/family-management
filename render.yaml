# Render Blueprint for family-manager — one service serving both the API
# and the built frontend from the same origin.
#
# Why one service: this used to be two separate Render services (an API
# web service + a frontend static site) on different onrender.com
# subdomains. onrender.com is on the public suffix list, so those counted
# as different "sites" to a browser, making the session cookie a genuine
# third-party cookie — Safari blocks those by default, so every iPhone
# user could log in but the cookie never stuck ("Not authenticated" on the
# very next request). Serving the frontend from this same Express app
# makes it truly same-origin, which fixes that for every browser.
#
# This declares the service configuration only — no secrets live here.
# DATABASE_URL and JWT_SECRET use `sync: false`, meaning Render prompts
# for their actual values in the dashboard; they are never stored in this
# file or in git.
#
# Live: this service is deployed and auto-deploys from GitHub main.

services:
  - type: web
    name: family-manager-api
    runtime: node
    plan: free
    rootDir: server
    # Builds the frontend first (from the repo root, one level up) so its
    # output lands in ../dist, which server.js serves as static files —
    # then installs the backend's own dependencies.
    #
    # --include=dev on the root install is required, not optional: this
    # service's own NODE_ENV=production (below) is visible to `npm install`
    # during the build too, and npm's default behavior under
    # NODE_ENV=production is to skip devDependencies entirely — which is
    # exactly where vite, typescript, and @types/node live in the root
    # package.json (`npm run build` runs `tsc -b && vite build`, so all
    # three are needed at build time). Without the flag, `npm install`
    # silently installs only react/react-dom and the build fails with
    # "Cannot find type definition file for 'vite/client'" /  'node'.
    # Confirmed by reproducing it in isolation: `NODE_ENV=production npm
    # install` installs 3 packages; `NODE_ENV=production npm install
    # --include=dev` installs all 166. The backend's own install (last
    # step) doesn't need the flag — server/package.json has no
    # devDependencies to begin with.
    buildCommand: cd .. && npm install --include=dev && npm run build && cd server && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Neon's pooled connection string (postgresql://...?sslmode=require).
      # Set manually in the Render dashboard — never committed.
      - key: DATABASE_URL
        sync: false
      # Optional now that the frontend is same-origin (served by this same
      # service) — only needed if some other, genuinely separate origin
      # ever needs to call this API directly.
      - key: CORS_ORIGIN
        sync: false
      # Signs session cookies (added in the auth milestone). Generate a
      # fresh random value for production — do not reuse the local one.
      - key: JWT_SECRET
        sync: false
      # Cookie security depends on this — enables `secure`, required for a
      # real HTTPS cookie in production.
      - key: NODE_ENV
        value: production
